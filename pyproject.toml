[project]
name = "btg-it-sessions-2026-module-ai"
version = "0.1.0"
description = "Projeto de IA para BTG IT Sessions 2026"
authors = [
    {name = "Idelfrides Jorge",email = "eng.idelfridesjorge@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "notebook (>=7.6.2,<8.0.0)",
    "jupyterlab (>=4.6.3,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pydataset (>=0.2.0,<0.3.0)"
]
